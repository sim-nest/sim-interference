[package]
name = "sim-lib-interference-compute"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
publish = false
description = "Normalized tile-local f32 Tensor lowering for coherent interference."
keywords = ["interference", "tensor", "compute", "simulation"]
categories = ["science", "simulation"]

[dependencies]
sim-kernel = { version = "0.1.0" }
sim-lib-interference-core = { path = "../sim-lib-interference-core" }
sim-lib-interference-solve = { path = "../sim-lib-interference-solve" }
sim-lib-numbers-tensor = { version = "0.2.0" }

[dev-dependencies]
sim-kernel = { version = "0.1.0", features = ["test-support"] }
sim-lib-numbers-arith = { version = "0.2.0" }
sim-lib-numbers-float = { version = "0.2.0" }

[lints]
workspace = true
