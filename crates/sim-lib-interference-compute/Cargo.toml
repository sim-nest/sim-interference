[package]
name = "sim-lib-interference-compute"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
publish = true
description = "Normalized tile-local f32 Tensor lowering for coherent interference."
keywords = ["interference", "tensor", "compute", "simulation"]
categories = ["science", "simulation"]
include = [
  "/src/**",
  "/recipes/**",
  "/build.rs",
  "/README.md",
  "/BROCHURE.md",
]

[dependencies]
sim-cookbook = { version = "0.1.0" }
sim-kernel = { version = "0.1.0" }
sim-lib-interference-core = { version = "0.1.0", path = "../sim-lib-interference-core" }
sim-lib-interference-runtime = { version = "0.1.0", path = "../sim-lib-interference-runtime" }
sim-lib-interference-solve = { version = "0.1.0", path = "../sim-lib-interference-solve" }
sim-lib-numbers-tensor = { version = "0.2.0" }

[dev-dependencies]
sim-kernel = { version = "0.1.0", features = ["test-support"] }
sim-lib-compute-auto = { version = "0.3.0" }
sim-lib-compute-model = { version = "0.3.0" }
sim-lib-compute-wgpu = { version = "0.2.0" }
sim-lib-numbers-arith = { version = "0.3.0" }
sim-lib-numbers-float = { version = "0.3.0" }

[build-dependencies]
sim-cookbook = { version = "0.1.0" }

[lints]
workspace = true
