[package]
name = "sim-lib-interference-runtime"
version = "0.3.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
publish = true
description = "Tensor-backed Citizen records and Shape contracts for coherent interference studies."
keywords = ["interference", "tensor", "citizen", "simulation"]
categories = ["science", "simulation"]
include = [
  "/src/**",
  "/examples/**",
  "/recipes/**",
  "/build.rs",
  "/README.md",
  "/BROCHURE.md",
]

[dependencies]
sim-citizen = { version = "0.4.0" }
sim-cookbook = { version = "0.4.0" }
sim-kernel = { version = "0.4.0" }
sim-lib-interference-core = { version = "0.3.0", path = "../sim-lib-interference-core" }
sim-lib-interference-solve = { version = "0.3.0", path = "../sim-lib-interference-solve" }
sim-lib-numbers-tensor = { version = "0.4.0" }
sim-shape = { version = "0.4.0" }

[dev-dependencies]
sim-codec = { version = "0.3.0" }
sim-codec-binary = { version = "0.4.0" }
sim-codec-json = { version = "0.4.0" }
sim-codec-lisp = { version = "0.4.0" }
sim-kernel = { version = "0.4.0", features = ["test-support"] }

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }

[lints]
workspace = true
