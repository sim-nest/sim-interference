# GitHub Actions CI for this repository.
name: ci
on:
  pull_request: {}
  # Keep a manual trigger available during release-closeout CI recovery.
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SIMDOC_TOOLING_MANIFEST: ${{ github.workspace }}/sim-tooling/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo run -p xtask -- check-file-sizes
      - run: cargo run -p xtask -- check-recipes
      - run: cargo run -p xtask -- check-package-floors
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      # The shared simdoc encoder patches sibling SIM crates relative to the
      # sim-tooling checkout, so only materialize those sibling repos once the
      # repo-local gates above have already finished scanning this checkout.
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-citizen
          path: sim-citizen
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-codecs
          path: sim-codecs
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-foundation
          path: sim-foundation
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-kernel
          path: sim-kernel
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-shape
          path: sim-shape
      - uses: actions/checkout@v4
        with:
          repository: sim-nest/sim-tooling
          path: sim-tooling
      - run: cargo run -p xtask -- simdoc --check
