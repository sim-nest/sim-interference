[[feature]]
id = "feature/sim-interference/quantity-vocabulary"
title = "Checked interference quantity vocabulary"
summary = "Admit finite scalar-wave inputs through explicit distance, frequency, speed, attenuation, phase, and amplitude boundary types."
owner = "crate/sim-lib-interference-core"
audiences = ["code", "framework"]
guidance = "Use these focused wrappers at interference-domain boundaries. Metres may be signed, positive distances, frequency, and speed are strictly positive, attenuation and amplitude are non-negative, and phase is stored in [-pi, pi). This is not a general units framework and does not claim a wave solver."
claims_anchors = [
  "anchor/crate/sim-lib-interference-core",
  "anchor/rustdoc/sim-lib-interference-core/crate-root",
  "anchor/rustdoc/sim-lib-interference-core/field-amplitude",
  "anchor/rustdoc/sim-lib-interference-core/hertz",
  "anchor/rustdoc/sim-lib-interference-core/interference-error",
  "anchor/rustdoc/sim-lib-interference-core/metres",
  "anchor/rustdoc/sim-lib-interference-core/metres-per-second",
  "anchor/rustdoc/sim-lib-interference-core/nepers-per-metre",
  "anchor/rustdoc/sim-lib-interference-core/positive-metres",
  "anchor/rustdoc/sim-lib-interference-core/radians",
]
claims_specimens = [
  "recipe/sim-interference/01-basics/checked-quantities",
  "spec-test/sim-interference/crates/sim-lib-interference-core/tests/quantity_conformance",
]

[[feature]]
id = "feature/sim-interference/scalar-wave-model"
title = "Exact coherent scalar-wave model"
summary = "Describe one-frequency coherent point and forward-plane emitters in a homogeneous attenuating medium, with canonical source identity and pure single-point Green functions."
owner = "crate/sim-lib-interference-core"
audiences = ["code", "framework"]
guidance = "Use InterferenceProblem as the exact dependency-free domain boundary: it fixes u=Re{U exp(-i omega t)}, k_tilde=omega/c+i alpha, outgoing positive propagation phase, a one-metre point reference, a positive singularity exclusion, and the forward-plane half-space. SourceSet sorts unique non-empty ids and emitters carry no frequency. contribution_at is a pure f64 single-source specification function, not a grid solver. This model is homogeneous, isotropic, scalar, three-dimensional, and free-field; it does not claim polarization, impedance-derived intensity, interfaces, obstacles, diffraction, or a general Helmholtz mesh."
claims_anchors = [
  "anchor/rustdoc/sim-lib-interference-core/contribution_at",
  "anchor/rustdoc/sim-lib-interference-core/emitter",
  "anchor/rustdoc/sim-lib-interference-core/forward_plane_contribution_at",
  "anchor/rustdoc/sim-lib-interference-core/interference-problem",
  "anchor/rustdoc/sim-lib-interference-core/point3-m",
  "anchor/rustdoc/sim-lib-interference-core/point_contribution_at",
  "anchor/rustdoc/sim-lib-interference-core/point_source_reference_distance_metres",
  "anchor/rustdoc/sim-lib-interference-core/scalar-medium",
  "anchor/rustdoc/sim-lib-interference-core/source-set",
  "anchor/rustdoc/sim-lib-interference-core/unit-vector3",
  "anchor/rustdoc/sim-lib-interference-core/wave-number",
]
claims_specimens = [
  "spec-test/sim-interference/crates/sim-lib-interference-core/tests/model_conformance",
  "spec-test/sim-interference/crates/sim-lib-interference-core/tests/propagation_conformance",
]

[[feature]]
id = "feature/sim-interference/certified-sampling"
title = "Certified physical plane sampling"
summary = "Define exact finite plane samples, classify carrier, power-fringe, and point-envelope resolution, and bound solve work before allocation."
owner = "crate/sim-lib-interference-core"
audiences = ["code", "framework"]
guidance = "Construct SamplingPlane for an orthonormal physical pixel-centre grid, then use RequestPreflight before allocating field storage. Every SamplingCertificate carries the explicit SamplingThresholds used to classify resolved, marginal, or aliased input. Strict is fail-closed; Annotate is an explicit evidence-preserving opt-in. WorkEstimate uses checked arithmetic for cells, emitter evaluations, host/result bytes, and seven-point certificate stencil work, and WorkBudget limits each number independently."
claims_anchors = [
  "anchor/rustdoc/sim-lib-interference-core/request-preflight",
  "anchor/rustdoc/sim-lib-interference-core/sampling-certificate",
  "anchor/rustdoc/sim-lib-interference-core/sampling-plane",
  "anchor/rustdoc/sim-lib-interference-core/sampling-policy",
  "anchor/rustdoc/sim-lib-interference-core/sampling-thresholds",
  "anchor/rustdoc/sim-lib-interference-core/sampling-verdict",
  "anchor/rustdoc/sim-lib-interference-core/work-budget",
  "anchor/rustdoc/sim-lib-interference-core/work-estimate",
  "anchor/rustdoc/sim-lib-interference-core/work-metric",
]
claims_specimens = [
  "spec-test/sim-interference/crates/sim-lib-interference-core/tests/budget_conformance",
  "spec-test/sim-interference/crates/sim-lib-interference-core/tests/certificate_conformance",
  "spec-test/sim-interference/crates/sim-lib-interference-core/tests/sampling_acceptance_conformance",
  "spec-test/sim-interference/crates/sim-lib-interference-core/tests/sampling_conformance",
]

[[feature]]
id = "feature/sim-interference/deterministic-reference-solver"
title = "Verified deterministic CPU phasor reference"
summary = "Solve admitted coherent scalar-wave problems into complete row-major f64 component planes, then check analytic identities, metamorphic laws, and Helmholtz residual convergence."
owner = "crate/sim-lib-interference-solve"
audiences = ["code", "framework"]
guidance = "Use ReferencePhasorSolver as the dependency-free executable specification. It admits the complete request and every cell/source geometry before output allocation, visits cells row-major and sources in stable-id order, applies Neumaier compensation independently to real and imaginary components, and returns a HostPhasorField plus immutable SolveEvidence or no field. Run verify_reference_solver for fail-closed plane-period, point-spreading, attenuation, interference, reciprocity, linearity, rigid-motion, global-phase, source-permutation, outgoing-crest, and seven-point Helmholtz checks. The Helmholtz matrix covers point, plane, mixed, attenuating, and multi-source fields at common physical points for h and h/2. This crate does not claim tensor runtime storage, acceleration, or presentation."
claims_anchors = [
  "anchor/crate/sim-lib-interference-solve",
  "anchor/rustdoc/sim-lib-interference-solve/crate-root",
  "anchor/rustdoc/sim-lib-interference-solve/host-phasor-field",
  "anchor/rustdoc/sim-lib-interference-solve/reference-phasor-solver",
  "anchor/rustdoc/sim-lib-interference-solve/reference-solve-error",
  "anchor/rustdoc/sim-lib-interference-solve/solve-evidence",
  "anchor/rustdoc/sim-lib-interference-solve/verification-error",
  "anchor/rustdoc/sim-lib-interference-solve/verification-report",
  "anchor/rustdoc/sim-lib-interference-solve/verify_reference_solver",
]
claims_specimens = [
  "spec-test/sim-interference/crates/sim-lib-interference-solve/tests/reference_conformance",
  "spec-test/sim-interference/crates/sim-lib-interference-solve/tests/verification_conformance",
]

[[feature]]
id = "feature/sim-interference/certified-interference"
title = "Certified observables and detector reduction"
summary = "Project coherent phasors into honest scalar observables and reduce them through explicit detectors without dropping samples or averaging wrapped phase."
owner = "crate/sim-lib-interference-solve"
audiences = ["code", "framework"]
guidance = "Use project for full-detail real, imaginary, amplitude, masked phase, normalized squared-magnitude, or Instant { wt } observation. Use reduce_for_view only with the detector rule matching the observable: complex mean before phase-sensitive projection, scalar area mean for amplitude, or squared-magnitude area mean for the normalized energy proxy. Detail refuses a smaller target. Integer axis partitions cover every source cell exactly once, including odd and non-divisible grids. ScalarProjection always carries ProjectionCertificate with dimensions, footprint bounds, rule, loss class, unchanged source SamplingCertificate, and mask count."
claims_anchors = [
  "anchor/rustdoc/sim-lib-interference-solve/detector-footprint",
  "anchor/rustdoc/sim-lib-interference-solve/grid-dimensions",
  "anchor/rustdoc/sim-lib-interference-solve/loss-class",
  "anchor/rustdoc/sim-lib-interference-solve/observable",
  "anchor/rustdoc/sim-lib-interference-solve/project",
  "anchor/rustdoc/sim-lib-interference-solve/projection-certificate",
  "anchor/rustdoc/sim-lib-interference-solve/projection-error",
  "anchor/rustdoc/sim-lib-interference-solve/reduce_for_view",
  "anchor/rustdoc/sim-lib-interference-solve/reduction-rule",
  "anchor/rustdoc/sim-lib-interference-solve/scalar-projection",
  "anchor/rustdoc/sim-lib-interference-solve/scalar-sample",
]
claims_specimens = [
  "spec-test/sim-interference/crates/sim-lib-interference-solve/tests/projection_conformance",
]

[[feature]]
id = "feature/sim-interference/fringe-analysis-scenarios"
title = "Certified fringe analysis and bounded scenarios"
summary = "Summarize amplitude-like fields without losing provenance and construct bounded canonical source scenarios with explicit aperture approximation evidence."
owner = "crate/sim-lib-interference-solve"
audiences = ["code", "framework"]
guidance = "Use analyze_fringes on amplitude or normalized squared-magnitude projections. FringeReport retains the unchanged SamplingCertificate plus ProjectionIdentity, deterministic row-major statistics, strict eight-neighbour node/antinode candidates, and optional Michelson contrast; contrast is absent below the declared amplitude floor. Use ScenarioBuilder for two-point, inward counter-propagating plane, progressive-phase line-array, and rectangular discrete-aperture problems. ScenarioLimits checks source and generated-id bounds before allocation. Array/aperture total amplitude is divided equally across elements, spacing is reported in wavelengths, and AperturePolicy::Strict refuses active spacing above lambda/2 while Annotate preserves sparse approximation evidence."
claims_anchors = [
  "anchor/rustdoc/sim-lib-interference-solve/absolute_max_generated_id_bytes",
  "anchor/rustdoc/sim-lib-interference-solve/absolute_max_scenario_sources",
  "anchor/rustdoc/sim-lib-interference-solve/absolute_max_total_id_bytes",
