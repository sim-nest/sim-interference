[[feature]]
id = "feature/sim-interference/certified-multitone-composition"
title = "Certified multi-tone composition"
summary = "Combine independently certified coherent frequency studies on identical physical sample geometry as incoherent squared magnitude or shared-clock instantaneous scalars."
owner = "crate/sim-lib-interference-solve"
audiences = ["code", "framework"]
guidance = "Use ToneStudy::solve to seal each one-frequency InterferenceProblem, exact SamplingPlane, positive weight, HostPhasorField, and SolveEvidence. MultiToneStudy rejects empty sets, duplicate frequencies, and any exact plane mismatch, then orders components by frequency. ToneCombination never adds unlike phasors: IncoherentMagnitudeSquared sums weighted normalized amplitude-squared observations, not impedance-derived intensity, power, or energy, while Instant sums weighted real component observations at one finite time. MultiToneSamplingRequirements uses the highest frequency for the spatial carrier certificate and temporal Nyquist floor; every MultiToneProjection retains the shared plane, combination, set requirements, and each component's original certificate."
