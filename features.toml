[[feature]]
id = "feature/sim-interference/normalized-tensor-lowering"
title = "Normalized tile-local Tensor lowering"
summary = "Lower coherent point and forward-plane fields into bounded tile-local f32 Tensor arithmetic without exposing large-world coordinates or absolute phase to an executor."
owner = "crate/sim-lib-interference-compute"
audiences = ["code", "framework"]
guidance = "Use LoweringPlan::preflight to capture the active TensorExecutor and admit the complete problem before submission. TileProfile bounds elements, segments, tensor bytes, and final result bytes; PhaseBudget caps residual phase at pi plus predicted geometry and roundoff error. PointTileConstants use host f64 n0, rho, phase sin/cos, and gain; PlaneTileConstants use host signed distance, phase, and gain. Execution composes only canonical add/sub/mul/div/sqrt/exp/sin/cos operations and a deterministic pairwise source tree. Use solve_dense_f32_cpu for the portable CPU baseline; compare_dense_to_reference and compare_materialized_to_reference feed dense, modeled, and physical results through one fixed absolute-plus-relative real, imaginary, amplitude, above-floor wrapped-phase, and squared-magnitude report. DenseExecutionEvidence retains the executor, tile and segment counts, submissions, admitted phase limit, predicted tile bound, observed max psi, and predicted error bounds; DifferentialReport retains every maximum and the true worst normalized cell. The checked decade sweep proves normalized error remains bounded while naive absolute-f32 phase error grows. LoweringPlan itself defines no device API, shader, queue, storage type, or compute-site selector; the separate resident-compute feature composes it with the runtime provider seam."
claims_anchors = [
  "anchor/crate/sim-lib-interference-compute",
  "anchor/rustdoc/sim-lib-interference-compute/crate-root",
  "anchor/rustdoc/sim-lib-interference-compute/compare_dense_to_reference",
