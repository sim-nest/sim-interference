[[feature]]
id = "feature/sim-interference/resident-compute-studies"
title = "Resident interference studies on compute sites"
summary = "Route an admitted interference Study through the active Env-bound Tensor executor, with pre-submission CPU selection, resident f32 results, explicit transfer evidence, and no restart after provider selection."
owner = "crate/sim-lib-interference-compute"
audiences = ["user", "code", "framework"]
guidance = "Load InterferenceComputeLib beside InterferenceLib, then realize the unchanged interference/solve expression at a TensorSite. The site-scoped tensor/executor binding selects TensorStudySolver through the runtime's tensor-study-solver slot. No executor, an automatic provider's explicit CPU choice, a missing required operation, an unsupported f32 profile, work below min_accelerated_cells, or an output requiring host tile assembly selects the deterministic CPU reference before submission. A selected provider owns the request: OOM, deadline, device-loss, execution, metadata, and readback failures are returned without CPU restart. Each tile's three immutable coordinate planes upload once, all arithmetic intermediates remain resident, and explicit host observation materializes only real and imaginary; repeated observation uses the Tensor storage cache. StudyEvidence records provider, adapter/profile, uploads, accepted submissions, segments, zero intermediate materializations, two final component materializations, and the fixed f32 tolerances. Product conformance repeats the study at a modeled TensorSite. Physical adapter discovery and acceptance are owned by the compute CLI acceptance harness and the sim-platform capsule; this repository performs no host discovery."
claims_anchors = [
  "anchor/runtime-lib/sim-lib-interference-compute/interference-compute-lib",
  "anchor/rustdoc/sim-lib-interference-compute/cpu-fallback-reason",
  "anchor/rustdoc/sim-lib-interference-compute/hardware-evidence-metrics",
